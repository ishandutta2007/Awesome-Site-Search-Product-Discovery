<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic background animated pulses */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.65; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-35px, 30px) scale(1.2); opacity: 0.6; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
    }
    @keyframes pingWave {
      0% { r: 18; opacity: 0.8; stroke-width: 2.5; }
      100% { r: 52; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes sweepBeam {
      0% { transform: translateX(-150px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateX(1350px); opacity: 0; }
    }
    @keyframes pulsePill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .orb-1 { animation: floatOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 11s ease-in-out infinite; }
    .ping-circle { animation: pingWave 3s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .laser-beam { animation: sweepBeam 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pill-1 { animation: pulsePill 4.5s ease-in-out infinite; }
    .pill-2 { animation: pulsePill 5.2s ease-in-out 1s infinite; }
    .pill-3 { animation: pulsePill 4.8s ease-in-out 2s infinite; }
    .pill-4 { animation: pulsePill 5.5s ease-in-out 0.5s infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs behind content -->
  <circle class="orb-1" cx="220" cy="90" r="130" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="240" r="140" fill="#ec4899" filter="url(#glow)" />
  <circle class="orb-1" cx="800" cy="70" r="90" fill="#06b6d4" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Scanning Beam on top border -->
  <rect class="laser-beam" y="0" width="180" height="3" fill="url(#primaryGlow)" filter="url(#glow)" />

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle, & Discovery Features -->

  <!-- Top Center Badge -->
  <g transform="translate(450, 36)">
    <rect width="300" height="32" rx="16" fill="url(#glassGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <circle class="ping-circle" cx="20" cy="16" r="5" fill="none" stroke="#10b981" />
    <text x="155" y="21" fill="#e0e7ff" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Search / Discovery Decorative Icon Mark -->
  <g transform="translate(68, 120)">
    <!-- Ambient circle background -->
    <circle cx="34" cy="34" r="34" fill="url(#primaryGlow)" opacity="0.15" />
    <circle cx="34" cy="34" r="33" fill="none" stroke="url(#primaryGlow)" stroke-width="1.8" />
    <!-- Magnifying Glass & Discovery Rays -->
    <path d="M28 20 A 11 11 0 1 1 20 28 A 11 11 0 0 1 28 20 M36 36 L 47 47" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <path d="M26 15 L 26 12 M34 18 L 37 15 M18 26 L 15 26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="160" y="148" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Site Search <tspan fill="url(#primaryGlow)">&amp; Product Discovery</tspan>
  </text>

  <!-- Subtitle Text -->
  <text x="160" y="190" font-size="17" font-weight="400" fill="#94a3b8">
    Intelligent Ecommerce Search • Visual Merchandising • Semantic Vector Retrieval • AI Discovery
  </text>

  <!-- Dynamic Feature Badges / Pills in Foreground (Lower Area) -->
  <g class="pill-1" transform="translate(160, 246)">
    <rect width="185" height="42" rx="21" fill="url(#glassGrad)" stroke="#475569" stroke-width="1.2" />
    <text x="92" y="26" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">⚡ Sub-50ms Autocomplete</text>
  </g>

  <g class="pill-2" transform="translate(365, 246)">
    <rect width="185" height="42" rx="21" fill="url(#glassGrad)" stroke="#475569" stroke-width="1.2" />
    <text x="92" y="26" fill="#c084fc" font-size="13" font-weight="600" text-anchor="middle">🎯 Semantic Vector Search</text>
  </g>

  <g class="pill-3" transform="translate(570, 246)">
    <rect width="195" height="42" rx="21" fill="url(#glassGrad)" stroke="#475569" stroke-width="1.2" />
    <text x="97" y="26" fill="#f472b6" font-size="13" font-weight="600" text-anchor="middle">🛍️ Automated Merchandising</text>
  </g>

  <g class="pill-4" transform="translate(785, 246)">
    <rect width="210" height="42" rx="21" fill="url(#glassGrad)" stroke="#475569" stroke-width="1.2" />
    <text x="105" y="26" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">🔍 Faceted Filter Navigation</text>
  </g>

  <!-- Subtle bottom border line -->
  <line x1="0" y1="359" x2="1200" y2="359" stroke="#1e293b" stroke-width="1" />
</svg>
